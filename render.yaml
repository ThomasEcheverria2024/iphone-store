services:
  - type: web
    name: iphone-stock-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_ADMIN_EMAIL
        sync: false
      - key: SESSION_SECRET
        sync: false
